
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can I Move There?</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <p class="logo">Can I Move There?</p>
    </header>

    <main>
        <section class="hero">
            <p class="intro">NEW PLACES. NEW POSSIBILITIES.</p>

            <h1>Can I Move There?</h1>

            <p class="description">
                What would it take to make somewhere new your home?
                Start exploring the possibilities.
            </p>

            

<form id="destination-form">

    <label for="country">Where are you thinking of moving?</label>

    <select id="country" name="country" required>
        
        <option value="">Choose a country</option>
        <option value="australia">Australia</option>
        <option value="canada">Canada</option>
        <option value="costa-rica">Costa Rica</option>
        <option value="france">France</option>
        <option value="germany">Germany</option>
        <option value="greece">Greece</option>
        <option value="ireland">Ireland</option>
        <option value="italy">Italy</option>
        <option value="japan">Japan</option>
        <option value="malaysia">Malaysia</option>
        <option value="mexico">Mexico</option>
        <option value="netherlands">Netherlands</option>
        <option value="new-zealand">New Zealand</option>
        <option value="portugal">Portugal</option>
        <option value="singapore">Singapore</option>
        <option value="south-africa">South Africa</option>
        <option value="south-korea">South Korea</option>
        <option value="spain">Spain</option>
        <option value="sweden">Sweden</option>
        <option value="switzerland">Switzerland</option>
        <option value="thailand">Thailand</option>
        <option value="united-arab-emirates">United Arab Emirates</option>
        <option value="usa">United States</option>

    </select>

    <button type="submit">Explore destinations</button>

</form>

    <div id="results"></div>

        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
